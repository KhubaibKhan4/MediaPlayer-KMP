#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
org.gradle.configuration-cache=true
#Kotlin
kotlin.code.style=official
kotlin.js.compiler=ir
#MPP
kotlin.mpp.enableCInteropCommonization=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

##JS
org.jetbrains.compose.experimental.jscanvas.enabled=true

# Publishing credentials must not be committed. CI reads them from GitHub secrets
# (see .github/workflows/publish.yml); for local publishing put mavenCentralUsername,
# mavenCentralPassword and signingInMemoryKey* in ~/.gradle/gradle.properties.

org.gradle.unsafe.configuration-cache=false
kotlin.native.ignoreDisabledTargets=true

kotlin.js.debug=true
kotlin.wasm.debug=true
