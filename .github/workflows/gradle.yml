name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: JVM, Android, Web
            os: ubuntu-latest
            tasks: >
              :mediaplayer-kmp:jvmTest
              :mediaplayer-kmp:testDebugUnitTest
              :mediaplayer-kmp:assembleRelease
              :mediaplayer-kmp:compileKotlinJs
              :mediaplayer-kmp:compileKotlinWasmJs
              :sample:composeApp:assembleDebug
          - name: iOS
            os: macos-latest
            tasks: >
              :mediaplayer-kmp:iosSimulatorArm64Test
              :sample:composeApp:linkDebugFrameworkIosSimulatorArm64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew ${{ matrix.tasks }} --no-configuration-cache
